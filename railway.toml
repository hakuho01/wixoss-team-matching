# Built for Railway: set DATABASE_URL from Postgres plugin and SESSION_SECRET.

[build]
builder = "NIXPACKS"
# Nixpacks already installs dependencies; re-running npm ci causes EBUSY on node_modules.
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && node scripts/ensure-admin.mjs && npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
