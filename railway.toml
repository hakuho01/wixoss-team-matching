# Built for Railway: set DATABASE_URL from Postgres plugin and SESSION_SECRET.

# Use the Nixpacks/Node builder. Start command is npm start after build.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
